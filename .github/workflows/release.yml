name: Build and release CleanC
on:
  push:
    branches: [main, fix/production-readiness-20260923]
    paths-ignore: ['updates/**', '**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore CleanC.sln
      - name: Build
        run: dotnet build CleanC.sln -c Release --no-restore
      - name: Regression tests
        run: dotnet run --project tests/CleanC.Tests -c Release --no-build
      - name: Production public-key bootstrap smoke (read only)
        env:
          CLEANC_LIVE_TESTS: '1'
        run: dotnet run --project tests/CleanC.Tests -c Release --no-build
      - name: QR decoding regression
        run: dotnet run --project tests/CleanC.QrTests -c Release
      - name: Real WinUI navigation and offline-input regressions (isolated fixtures)
        timeout-minutes: 4
        shell: pwsh
        run: |
          dotnet build tests/CleanC.UiTests -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'UI fixture build failed' }
          $exe = Resolve-Path 'tests/CleanC.UiTests/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/CleanC.UiTests.exe'
          $ui = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          if (-not $ui.WaitForExit(60000)) { throw 'UI fixture did not exit within 60 seconds' }
          $fixture = Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'CleanC-ui-tests-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($fixture -and (Test-Path (Join-Path $fixture.FullName 'result.txt'))) { Get-Content (Join-Path $fixture.FullName 'result.txt') }
          if ($ui.ExitCode -ne 0) { throw "UI fixture exit $($ui.ExitCode)" }
      - name: Publish
        run: dotnet publish src/CleanC.App/CleanC.App.csproj -c Release -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false -r win-x64 --self-contained true -o artifacts/publish
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc build/CleanC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path artifacts/publish/CleanC.pri)) { throw 'Missing WinUI resources' }
      - name: Installer install, reinstall and uninstall smoke (ephemeral runner only)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP ('CleanC-UPDATE-install-smoke-' + [guid]::NewGuid().ToString('N'))
          $sentinelDirectory = Join-Path $env:LOCALAPPDATA 'CleanC'
          New-Item -ItemType Directory -Path $sentinelDirectory -Force | Out-Null
          $sentinel = Join-Path $sentinelDirectory 'ci-preserve-sentinel.txt'
          'test fixture, not an authorization' | Set-Content -LiteralPath $sentinel
          $expected = (Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash
          foreach ($attempt in 1..2) {
            $setupArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR=`"$target`""))
            if ($attempt -eq 2) { $setupArgs += '/UPDATE' }
            # Wait only for the installer, not its intentionally long-lived app child.
            $setup = Start-Process -FilePath (Resolve-Path artifacts/installer/CleanC-Setup.exe) -ArgumentList $setupArgs -WindowStyle Hidden -PassThru
            if (-not $setup.WaitForExit(120000)) { throw 'Installer did not exit within two minutes' }
            if ($setup.ExitCode -ne 0) { throw "Installer exit $($setup.ExitCode)" }
            if (-not (Test-Path -LiteralPath (Join-Path $target 'CleanC.pri'))) { throw 'Installed resources missing' }
            [xml]$props = Get-Content Directory.Build.props
            $installedVersion = (Get-Item -LiteralPath (Join-Path $target 'CleanC.exe')).VersionInfo.ProductVersion
            if ($installedVersion.Split('+')[0] -ne [string]$props.Project.PropertyGroup.Version) { throw 'Installed version mismatch' }
            $origin = Get-Content -LiteralPath (Join-Path $target 'upgrade-origin.json') -Raw | ConvertFrom-Json
            $expectedChannel = if ($attempt -eq 2) { 'in-app' } else { 'manual' }
            if ($origin.channel -ne $expectedChannel -or $origin.version -ne [string]$props.Project.PropertyGroup.Version) { throw 'Installer upgrade provenance mismatch' }
            if ((Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash -ne $expected) { throw 'Install altered persisted data fixture' }
          }
          # Only the app launched by this test installer in the ephemeral runner.
          Start-Sleep -Seconds 5
          $appExe = Join-Path $target 'CleanC.exe'
          $installedApps = @(Get-Process -Name CleanC -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $appExe })
          if ($installedApps.Count -eq 0) { throw 'Updated installed application did not remain running' }
          foreach ($app in $installedApps) { $null = $app.CloseMainWindow(); if (-not $app.WaitForExit(15000)) { Stop-Process -Id $app.Id -Force } }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'Uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path -LiteralPath (Join-Path $target 'CleanC.exe')) { throw 'Uninstall left application executable' }
          if ((Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash -ne $expected) { throw 'Uninstall removed persisted data fixture' }
      - uses: actions/upload-artifact@v4
        with:
          name: CleanC-Windows-x64
          path: artifacts/**
          if-no-files-found: error
      - name: Publish verified release and update manifest
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $tag = "v$version"
          $file = Get-Item artifacts/installer/CleanC-Setup.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version already released; increment Version before publishing' }
          gh release create $tag $file.FullName --title "CleanC $version" --notes-file "docs/Release-$version.md" --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $verification = Join-Path $env:RUNNER_TEMP ('cleanc-release-verify-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verification | Out-Null
          gh release download $tag --pattern 'CleanC-Setup.exe' --dir $verification
          if ($LASTEXITCODE -ne 0) { throw 'Published asset download verification failed' }
          $downloaded = Get-Item (Join-Path $verification 'CleanC-Setup.exe')
          if ($downloaded.Length -ne $file.Length -or (Get-FileHash $downloaded.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Published asset does not match build; update manifest not changed' }
          New-Item -ItemType Directory -Force updates | Out-Null
          @{version=$version;url="https://github.com/wwz554/CleanC/releases/download/$tag/CleanC-Setup.exe";sha256=$hash;size=$file.Length;notes="CleanC $version"} | ConvertTo-Json | Set-Content -Encoding utf8NoBOM updates/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          git commit -m "release: publish update manifest $version"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest push failed' }
